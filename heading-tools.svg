<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 70" width="640" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#E040FB"/>
      <stop offset="0.5" stop-color="#3B82C4"/>
      <stop offset="1" stop-color="#E040FB"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="320" y="38" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#flow)">Programming Languages &amp; Tools</text>
  <rect x="250" y="52" width="140" height="3" rx="1.5" fill="url(#flow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="100;140;100" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="270;250;270" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
